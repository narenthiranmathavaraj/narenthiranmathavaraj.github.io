<div class="certificate-card reveal">
    <div class="certificate-image">
        <img src="assets/images/certificates/[YOUR_CERTIFICATE].png" alt="Certificate">
        <span class="certificate-badge">Verified</span>
    </div>
    <div class="certificate-info">
        <h3>[CERTIFICATE_TITLE]</h3>
        <p class="certificate-issuer">Issued by: [ISSUER_NAME]</p>
        <p>[CERTIFICATE_DESCRIPTION]</p>
        <div class="certificate-footer">
            <span class="certificate-date">[MONTH YEAR]</span>
            <a href="[VERIFICATION_URL]" target="_blank" class="verify-link">Verify →</a>
        </div>
    </div>
</div>
